Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Module"
    Disable "glx"
EndSection

Section "Device"
    Identifier "NokiaFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "InternalDisplay"
EndSection

Section "Screen"
    Identifier "InternalScreen"
    Device "NokiaFramebuffer"
    Monitor "InternalDisplay"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Virtual 240 320
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "Nokia"
    Screen "InternalScreen"
EndSection
