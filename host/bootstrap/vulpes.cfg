// Local Vulpes bootstrap, loaded only for the isolated host launcher.
try {
 if (Services.env.get('VULPES_HOST_ROOT')) {
  var root = Components.classes['@mozilla.org/file/local;1'].createInstance(Components.interfaces.nsIFile);
  root.initWithPath(Services.env.get('VULPES_HOST_ROOT'));
  var baseURI = Services.io.newFileURI(root);
  var manifest = root.clone(); manifest.append('chrome.manifest');
  var vulpesRegistration = Components.classes['@mozilla.org/addons/addon-manager-startup;1'].getService(Components.interfaces.amIAddonManagerStartup).registerChrome(Services.io.newFileURI(manifest), [['content','vulpes','./']]);
  Services.io.getProtocolHandler('resource').QueryInterface(Components.interfaces.nsIResProtocolHandler).setSubstitution('vulpes',Services.io.newURI('../',null,baseURI));
 }
} catch(e) { Components.utils.reportError(e); }
