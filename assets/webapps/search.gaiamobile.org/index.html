  <body>

    <div id="search-results" class="hidden">
      <div id="offline-message">
        <span id="settings-connectivity"></span>
        <span data-l10n-id="offline-message">No internet connection</span>
      </div>

      <section id="contacts" class="local" data-l10n-id="contacts" aria-label="Contacts"></section>

      <section id="icons-wrapper" class="apps" data-l10n-id="apps" aria-label="Apps">
        <gaia-grid cols="4" text-rows="3" id="icons"></gaia-grid>
      </section>

      <h2 id="places-header" class="hidden"><span data-l10n-id="history">HISTORY</span></h2>
      <section id="places" class="local" data-l10n-id="places" aria-label="Places"></section>

      <div id="suggestions-wrapper">
        <h2>
          <select id="suggestions-select"></select>
          <label for="suggestions-select" id="suggestions-provider"></label>
          <span id="suggestions-provider-dropdown"></span>
        </h2>

        <div id="suggestions-notice-wrapper" hidden="">
          <p data-l10n-id="suggestions-settings-notice">Search suggestions are enabled. The characters you type when entering a search are being sent to the search engine. You can disable search suggestions in the device <span id="settings-link">Settings</span>.</p>
          <button id="suggestions-notice-confirm" data-l10n-id="ok">OK</button>
        </div>

        <section id="suggestions" class="suggestions" data-l10n-id="suggestions" aria-label="Suggestions"></section>
        <div class="loading"><progress></progress></div>
      </div>
    </div>

    <menu id="contextmenu" hidden="">
      <menuitem label="Add to Home Screen" id="add-to-homescreen" data-l10n-id="add-to-home-screen" type="button"></menuitem>
