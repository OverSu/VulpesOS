    <!-- Specific style -->
    <link rel="stylesheet" type="text/css" href="style/onpair.css">

  <meta content="2.5" name="appVersion"></head>
  <body role="application">
    <form role="dialog" data-type="confirm" id="pair-view">
      <section>
        <h2 data-l10n-id="pair-view-title">Bluetooth Request From</h2>
        <h1 id="label-name"></h1>

        <p id="pair-description"></p>

        <span id="confirmation-method">
          <span id="passkey"></span>
        </span>

        <span id="pin-input-method" hidden="">
          <input id="pin-input" size="16" maxlength="16" dir="auto" type="text">
        </span>
      </section>
      <menu>
        <button type="reset" id="button-close" data-l10n-id="cancel">Cancel</button>
        <button type="submit" id="button-pair" class="recommend" data-l10n-id="pair">Pair</button>
      </menu>
    </form>
  </body>

</html>
