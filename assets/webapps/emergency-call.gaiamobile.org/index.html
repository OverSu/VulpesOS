  <meta content="2.5" name="appVersion"></head>
  <body class="skin-comms theme-communications">
    <article id="views" class="full-height">
      <section id="keyboard-view" class="full-height">
        <div id="phone-number-view-container" dir="ltr">
          <div class="phone-number-view-wrapper-input">
            <input aria-label="Phone number" id="phone-number-view" class="phone-number-font font-light textfield" readonly="readonly" data-l10n-id="phoneNumberInput" type="text">
            <div id="fake-phone-number-view"></div>
          </div>
          <button aria-label="Delete" role="key" id="keypad-delete" class="reset-button" data-value="delete" data-l10n-id="keypadDelete">
          </button>
        </div>
        <section id="ice-contacts-bar" class="ice-contacts-bar" data-l10n-id="ice-contacts-bar-text" hidden="">ICE Contacts - In Case of Emergency</section>
        <article id="keyboard-container" dir="ltr">
          <section id="keypad">
            <div class="keypad-row">
              <div class="keypad-key" role="key" data-value="1">
                <span>1</span>
                <em class="keypad-subicon"></em>
              </div>
              <div class="keypad-key" role="key" data-value="2">
                <span>2</span>
                <em>ABC</em>
              </div>
              <div class="keypad-key" role="key" data-value="3">
                <span>3</span>
                <em>DEF</em>
              </div>
            </div>
            <div class="keypad-row">
              <div class="keypad-key" role="key" data-value="4">
                <span>4</span>
                <em>GHI</em>
              </div>
              <div class="keypad-key" role="key" data-value="5">
                <span>5</span>
                <em>JKL</em>
              </div>
              <div class="keypad-key" role="key" data-value="6">
                <span>6</span>
                <em>MNO</em>
              </div>
            </div>
            <div class="keypad-row">
              <div class="keypad-key" role="key" data-value="7">
                <span>7</span>
                <em>PQRS</em>
              </div>
              <div class="keypad-key" role="key" data-value="8">
                <span>8</span>
                <em>TUV</em>
              </div>
              <div class="keypad-key" role="key" data-value="9">
                <span>9</span>
                <em>WXYZ</em>
              </div>
            </div>
            <div class="keypad-row">
              <div aria-label="Asterisk" class="keypad-key" role="key" data-value="*" data-l10n-id="asterisk">
                <div class="asterisk">*</div>
              </div>
              <div class="keypad-key" role="key" data-value="0">
                <span>0</span>
                <em class="font-size-plus">+</em>
              </div>
              <div aria-label="Hash sign" class="keypad-key" role="key" data-type="dial" data-value="#" data-l10n-id="hashSign">
                <div class="sharp">#</div>
              </div>
            </div>
          </section>
          <section id="keypad-callbar">
            <span role="button" id="keypad-callbar-cancel" class="keypad-callbar-button cancel" data-type="action" data-value="cancel">
              <div data-l10n-id="keypadCancel">Cancel</div>
            </span>
            <span role="button" id="keypad-callbar-call-action" data-type="action" data-value="make-call">
              <div>
              </div>
            </span>
          </section>
        </article>
      </section>
    </article>
    <form id="contact-list-overlay" role="dialog" data-type="action" class="overlay"><!--

    <header></header>
    <menu id="contact-list">
      <button id="contact-list-overlay-cancel" data-l10n-id="cancel">Cancel</button>
    </menu>

  --></form>
    <button id="contact-in-overlay" class="contact-item ci--action-menu" hidden=""><!--

      <div class="js-name ci__name ellipsis" dir="auto"></div>
      <div class="ci__details">
        <span class="js-tel-type ci__tel-type ellipsis" dir="auto"></span>
        <span class="js-separator"></span>
        <span class="js-tel ellipsis" dir="ltr"></span>
      </div>

  --></button>
    <form id="confirmation-message" class="hide no-opacity" role="dialog" data-type="confirm"><!--

     <section>
       <h1>Confirmation title</h1>
       <p>Confirmation message</p>
     </section>
     <menu>
       <button>Action 1</button>
       <button>Action 2</button>
     </menu>

  --></form>
