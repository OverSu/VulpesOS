  <body>
    <header id="page-indicator-header">
      <div aria-valuetext="Page {{ currentPage }} of {{ totalPages }}" id="page-indicator" data-l10n-id="page-indicator-text" role="slider" aria-valuemin="1" aria-valuenow="1" aria-valuemax="2" aria-controls="panels">
        <span></span><span></span>
      </div>
    </header>
    <div id="shadow"></div>
    <div id="panels"><!--
    --><div id="apps-panel" aria-labelledby="page-indicator-header">
        <div class="scrollable">
          <div class="edit-underlay"></div>
          <gaia-container id="apps" drag-and-drop=""></gaia-container>
        </div>
        <gaia-dialog id="cancel-download" class="dialog-action">
          <section>
            <p class="body" data-l10n-id="stop-download-body">Do you want to stop downloading {{ name }}?</p>
          </section>
          <button class="action" data-l10n-id="stop-download-action">Stop</button>
          <button on-click="close" data-l10n-id="cancel-action">Cancel</button>
        </gaia-dialog>
        <gaia-dialog id="resume-download" class="dialog-action">
          <section>
            <p class="body" data-l10n-id="resume-download-body">Do you want to download {{ name }}?</p>
          </section>
          <button class="action" data-l10n-id="resume-download-action">Download</button>
          <button on-click="close" data-l10n-id="cancel-action">Cancel</button>
        </gaia-dialog>
      </div><!--
   --><div id="pages-panel" aria-labelledby="page-indicator-header">
        <div id="empty-pages">
          <h1 data-l10n-id="no-pinned-pages-header">No Pinned Pages yet.</h1>
          <p data-l10n-id="no-pinned-pages-body">Use your browser to pin any web page to this screen.</p>
          <img src="style/images/empty_home_image.png" role="presentation">
          <div id="boxes" role="presentation">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
        <div class="scrollable">
          <div class="edit-underlay"></div>
          <gaia-container id="pages"></gaia-container>
        </div>
      </div><!--
 --></div>
    <div id="bottombar">
      <div id="remove"></div>
      <div id="rename"></div>
      <div id="done" data-l10n-id="edit-done">Done</div>
    </div>
  </body>
