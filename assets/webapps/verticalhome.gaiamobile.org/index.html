  <body class="theme-media">
    <div id="curtain"></div>

    <section id="edit-header" role="region">
      <gaia-header ignore-dir="">
        <h1 data-l10n-id="edit-mode">Edit</h1>
        <a href="#" data-l10n-id="edit-done" id="exit-edit-mode">Done</a>
      </gaia-header>
    </section>

    <div id="search" role="button" aria-labelledby="search-input" aria-haspopup="true">
      <form id="search-form">
        <input id="search-input" x-inputmode="verbatim" role="presentation" placeholder="Search or enter address" data-l10n-id="search-or-enter-address" value="" dir="auto" type="text">
        
      </form>
    </div>

    <gaia-grid id="icons" dragdrop=""></gaia-grid>

    <gaia-menu id="contextmenu-dialog" hidden="">
      <button id="homescreen-settings-action" data-l10n-id="homescreen-settings" type="button">Homescreen Settings</button>
      <button id="change-wallpaper-action" data-l10n-id="change-wallpaper" type="button">Change Wallpaper</button>
    </gaia-menu>

    <section id="edit-group" role="region" hidden="">
      <gaia-header ignore-dir="" id="edit-group-header" action="close">
        <h1 data-l10n-id="edit-group-header">Edit group</h1>
        <button id="edit-group-save" disabled="" type="button" data-l10n-id="edit-done">Done</button>
      </gaia-header>

      <form>
        <p>
          <input id="edit-group-title" x-inputmode="latin-prose" dir="auto" type="text">
          <button id="edit-group-title-clear" type="reset"></button>
        </p>
      </form>
    </section>
