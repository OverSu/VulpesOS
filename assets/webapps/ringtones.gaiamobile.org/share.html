  <body class="theme-media">
    <section role="region" class="skin-dark">
      <gaia-header ignore-dir="" id="header" action="close">
        <h1 id="title" data-l10n-id="create-title">Create Ringtone</h1>
        <button id="save" data-l10n-id="create-save" disabled="">Save</button>
      </gaia-header>

      <article>
        <section id="metadata">
          <div id="picture" hidden=""></div>
          <p><bdi id="songtitle"></bdi></p>
          <p class="small"><bdi id="artist"></bdi></p>
        </section>
        <audio id="preview" preload="metadata" loop=""></audio>
        <div id="playpause"></div>

        <section id="set-default">
          <gaia-checkbox class="inline" id="default-switch" checked="">
            <label data-l10n-id="default-label">Use as default ringtone</label>
          </gaia-checkbox>
        </section>
      </article>
    </section>

    <section id="saving-overlay" hidden="">
      <progress></progress>
    </section>
  </body>
