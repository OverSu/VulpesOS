<body role="application">
  <gaia-header id="header" no-font-fit="">
    <h1 id="header-title"></h1>
    <button aria-label="Go to player view" id="player-button" data-icon="play-circle" data-l10n-id="go-to-player-view" hidden=""></button>
    <button id="activity-done-button" data-l10n-id="done" hidden="">Done</button>
  </gaia-header>

  <music-view-stack id="view-stack">
    <iframe src="/views/songs/index.html"></iframe>
  </music-view-stack>

  <music-tab-bar id="tab-bar">
    <button aria-label="Songs" value="songs" data-url="/songs" data-icon="songs" data-l10n-id="songs-tab">
    </button>
  </music-tab-bar>

  <music-overlay id="empty-overlay" heading-l10n-id="empty-title" message-l10n-id="empty-text" hidden="">
    <button type="button" data-action="cancel" data-l10n-id="overlay-cancel-button">Cancel</button>
  </music-overlay>

  <music-overlay id="no-card-overlay" heading-l10n-id="nocard2-title" message-l10n-id="nocard3-text" hidden="">
    <button type="button" data-action="cancel" data-l10n-id="overlay-cancel-button">Cancel</button>
  </music-overlay>

  <music-overlay id="plugged-in-overlay" heading-l10n-id="pluggedin-title" message-l10n-id="pluggedin-text" hidden="">
    <button type="button" data-action="cancel" data-l10n-id="overlay-cancel-button">Cancel</button>
  </music-overlay>

  <music-overlay id="upgrade-overlay" heading-l10n-id="upgrade-title" message-l10n-id="upgrade-text" hidden="">
    <button type="button" data-action="cancel" data-l10n-id="overlay-cancel-button">Cancel</button>
  </music-overlay>

  <music-scan-progress id="scan-progress" heading-l10n-id="unknownArtist" subheading-l10n-id="unknownTitle">
  </music-scan-progress>

  <audio id="audio"></audio>
