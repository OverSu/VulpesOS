  <body class="theme-settings">
    <section role="region">
      <gaia-header id="fxa-module-header" action="close">
        <h1 data-l10n-id="firefox-accounts-title">Firefox Accounts</h1>
      </gaia-header>
      <div class="bb-steps">
        <progress id="fxa-progress" value="" max="100"></progress>
      </div>
      <article id="step-container">
        <section id="fxa-email" class="screen"><!--
    <section class="vertical">
      <div id="fxa-logo" class="fxa-logo"></div>
      <p class="fxa-intro" data-l10n-id="fxa-use-email-to-sign-in">
      </p>
      <input id="fxa-email-input" data-l10n-id="fxa-enter-email-input" placeholder="Enter your email" required="" x-inputmode="verbatim" type="email">

      <p id="fxa-notice" class="fine-print" data-l10n-id="fxa-notice2">
        <a id="fxa-terms" href="https://accounts.firefox.com/legal/terms"></a>
        <a id="fxa-privacy" href="https://accounts.firefox.com/legal/privacy"></a>
      </p>
    </section>
    <script src="js/screens/fxam_enter_email.js"></script>
  --></section>
        <section id="fxa-set-password" class="screen fxa-password"><!--
    <section class="vertical">
      <h3 data-l10n-id="fxa-create-password-title"></h3>
      <p id="fxa-hello-user"><a id="fxa-user-set-email"></a></p>
      <input id="fxa-pw-set-input" placeholder="Password" required="" pattern=".{8,}" data-l10n-id="fxa-password" x-inputmode="verbatim" type="password">
      <p class="fine-print" data-l10n-id="fxa-password-length-requirement">
      </p>
      <div id="show-pw-wrapper">
        <label class="pack-checkbox" for="fxa-show-pw-set">
          <input id="fxa-show-pw-set" type="checkbox">
          <span></span>
        </label>
        <p data-l10n-id="fxa-show-password"></p>
      </div>
      <script src="js/screens/fxam_set_password.js"></script>
    </section>
  --></section>
        <section id="fxa-enter-password" class="screen fxa-password"><!--
    <section class="vertical">
      <h3 data-l10n-id="fxa-enter-password-title">Enter Your Password</h3>
      <p id="fxa-hello-known-user">Hello, <a id="fxa-known-user-email">holaENTER@email.com</a></p>
      <input id="fxa-pw-input" placeholder="Password" required="" pattern=".{8,}" data-l10n-id="fxa-password" x-inputmode="verbatim" type="password">
      <p class="fine-print"><a id="fxa-forgot-password" data-l10n-id="fxa-forgot-your-password">Forgot your password?</a></p>
      <div id="show-pw-wrapper">
        <label class="pack-checkbox" for="fxa-show-pw">
          <input id="fxa-show-pw" type="checkbox">
          <span></span>
        </label>
        <p data-l10n-id="fxa-show-password">Show password</p>
      </div>
      <script src="js/screens/fxam_enter_password.js"></script>
    </section>
  --></section>
        <section id="fxa-signup-success" class="screen"><!--
    <section class="vertical">
      <h3 data-l10n-id="fxa-confirm-account">
        Confirm Your Account
      </h3>
      <p id="fxa-will-send-email" class="fxa-envelope">
        We will send an email to: <strong id="fxa-summary-email">email</strong>
      </p>
      <p data-l10n-id="fxa-signup-click-verification-link-in-email">
        Next time you check your email, click the verification link to confirm your Firefox Account.
      </p>
      <p data-l10n-id="fxa-access-manage-account-settings">
        In the future, you can access and manage your account from Settings.
      </p>
      <script src="js/screens/fxam_signup_success.js"></script>
    </section>
  --></section>
        <section id="fxa-signin-success" class="screen"><!--
    <section class="vertical">
      <h3 data-l10n-id="fxa-success">
        Success!
      </h3>
      <p data-l10n-id="fxa-ready-to-go">

      </p>
      <p data-l10n-id="fxa-use-features">

      </p>
      <p data-l10n-id="fxa-access-manage-account-settings">
        In the future, you can access and manage your account from Settings.
      </p>
      <script src="js/screens/fxam_signin_success.js"></script>
    </section>

        <section id="fxa-refresh-auth" class="screen fxa-password"><!--
    <section class="vertical">
      <p id="fxa-password-refresh" data-l10n-id="fxa-password-refresh">Please enter your Firefox Account password to continue.</p>
      <input id="fxa-pw-input-refresh" placeholder="Password" required="" pattern=".{8,}" data-l10n-id="fxa-password" type="password">

    <form role="dialog" data-type="confirm" id="fxa-error-overlay" class="fade-in">

        <h1 id="fxa-error-title"></h1>
