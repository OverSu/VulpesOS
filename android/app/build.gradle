plugins { id 'com.android.application' }
def vulpesRelease = new groovy.json.JsonSlurper().parse(rootProject.file('../release.json'))
def productVersion = vulpesRelease.version ?: "${vulpesRelease.gaia}-${vulpesRelease.channel}.${vulpesRelease.revision}"
android {
    namespace 'org.vulpes_os.preview'
    compileSdk { version = release(37) { minorApiLevel = 1 } }
    buildToolsVersion '37.0.0'
    defaultConfig {
        applicationId 'org.vulpes_os.preview'
        minSdk 26
        targetSdk 37
        versionCode vulpesRelease.androidVersionCode as int
        versionName productVersion
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs { debug { storeFile rootProject.file('keys/preview.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies { implementation "org.mozilla.geckoview:geckoview:${vulpesRelease.geckoview}" }
